name: Python pytests
  
  on: [push]
  
jobs:
  test:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: dummy

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest